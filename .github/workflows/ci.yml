name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # rust-embed requires the folder to exist at compile time.
      # In CI we don't run the Node build, so we create an empty stub.
      - name: Create ui/dist stub for rust-embed
        run: mkdir -p crates/lucyd-core/ui/dist

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so optional modules (lucyd-core's `openapi-diff`) are
      # linted too; without it they are never compiled in CI.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Same stub needed for tests since lucyd-core is compiled as a dependency.
      - name: Create ui/dist stub for rust-embed
        run: mkdir -p crates/lucyd-core/ui/dist

      # --all-features so optional modules (lucyd-core's `openapi-diff`) have
      # their test suites run.
      - name: Run tests
        run: cargo test --workspace --all-features
