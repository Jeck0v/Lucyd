name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Update workspace version from tag
        run: |
          sed -i "s/^version     = \".*\"/version     = \"$VERSION\"/" Cargo.toml
          sed -i "s/\(lucyd-types.*version = \)\"[^\"]*\"/\1\"$VERSION\"/" Cargo.toml
          sed -i "s/\(lucyd-core.*version = \)\"[^\"]*\"/\1\"$VERSION\"/" Cargo.toml
          sed -i "s/\(lucyd-macro.*version = \)\"[^\"]*\"/\1\"$VERSION\"/" Cargo.toml

      # The published crate embeds `crates/lucyd-core/ui/dist/` verbatim, and a
      # copy of it is committed. Rebuilding it here rather than trusting that
      # copy is what guarantees the bundle a user downloads was built from the
      # source at this tag: nothing else enforces that the two stay in step, so
      # a `.tsx` changed without re-running build-ui would otherwise ship a
      # stale UI silently. `build-ui` fails when the bundle does not land, so a
      # broken frontend build stops the release instead of publishing an empty
      # `/docs`. This is deliberately not the `mkdir -p` stub the lint and test
      # jobs use: there, an absent UI is fine because nothing serves it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the docs UI
        run: cargo xtask build-ui

      # --all-features so the OpenAPI diff is tested before it ships. Building
      # the workspace happens to enable it anyway, since lucyd-cli requires it,
      # but relying on feature unification to test the code being published is
      # a guarantee that disappears the day the dependency graph changes.
      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish lucyd-types
        run: cargo publish --allow-dirty -p lucyd-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for lucyd-types indexing
        run: sleep 30

      - name: Publish lucyd-core
        run: cargo publish --allow-dirty -p lucyd-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish lucyd-macro
        run: cargo publish --allow-dirty -p lucyd-macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for lucyd-core and lucyd-macro indexing
        run: sleep 30

      - name: Publish lucyd
        run: cargo publish --allow-dirty -p lucyd
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Only depends on lucyd-core, which the wait above already indexed, so
      # this needs no further delay of its own.
      - name: Publish lucyd-cli
        run: cargo publish --allow-dirty -p lucyd-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
