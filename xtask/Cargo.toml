[package]
name    = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Reused for both parsing an existing generated file (to merge into) and
# emitting the new one; workspace-pinned so they stay in lockstep with the
# versions lucy-macro already builds against.
syn         = { workspace = true }
quote       = { workspace = true }
proc-macro2 = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# Shared with lucyd-cli, which reads the same OpenAPI documents.
serde_yaml_ng = { workspace = true }

# Not added to [workspace.dependencies]: xtask is the only crate that needs it.
# Formats the generated `syn::File` back into readable source without
# shelling out to `rustfmt`.
prettyplease  = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
