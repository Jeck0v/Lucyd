[package]
name        = "lucyd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core runtime for lucyd: endpoint registry, spec generation, and docs router"
keywords    = ["axum", "documentation", "websocket", "mqtt", "router"]
categories  = ["web-programming::http-server", "development-tools"]
repository.workspace = true
include     = ["src/**/*", "ui/dist/**/*", "Cargo.toml"]

[features]
# Compares an existing OpenAPI document against the one Lucyd generates.
# Off by default: it is a migration/CI concern, not a runtime one, so an
# application that only serves `/docs` never compiles it.
openapi-diff = []

[dependencies]
axum        = { workspace = true }
tokio       = { workspace = true }
serde_json  = { workspace = true }
rust-embed  = { workspace = true }
lucyd-types = { workspace = true }
inventory   = { workspace = true }

[dev-dependencies]
jsonschema  = { workspace = true }
