[workspace]
resolver = "2"
members  = [
    "crates/lucyd",
    "crates/lucyd-types",
    "crates/lucyd-macro",
    "crates/lucyd-core",
    "crates/lucyd-cli",
    "xtask",
]
exclude = ["ui"]

[workspace.package]
version     = "0.2.0"
edition     = "2024"
license     = "MIT"
authors     = ["Arnaud Fischer"]
repository  = "https://github.com/Jeck0v/Lucyd"

[workspace.dependencies]
# Internal crates, path for local dev, version resolved from crates.io when published
lucyd-types = { path = "crates/lucyd-types", version = "0.2.0" }
lucyd-core  = { path = "crates/lucyd-core",  version = "0.2.0" }
lucyd-macro = { path = "crates/lucyd-macro", version = "0.2.0" }

# Async runtime
tokio = { version = "1.44.2", features = ["full"] }

# Web framework
axum = "0.8.4"

# Serialization
serde      = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Proc-macro utilities
proc-macro2 = "1.0.95"
syn         = { version = "2.0.100", features = ["full"] }
quote       = "1.0.40"

# Asset embedding
rust-embed = "8.5.0"

# JSON Schema generation
schemars = "0.8.22"

# JSON Schema validation (dev/test only: OpenAPI 3.1 conformance checks)
jsonschema = "0.40"

# Compile-time static registration
inventory = "0.3"

# Command-line argument parsing for the `lucyd` binary
clap = { version = "4.5", features = ["derive"] }

# YAML input: OpenAPI documents come in both flavours, and both xtask and
# lucyd-cli have to read them. Maintained fork of the archived `serde_yaml`;
# deserializes straight into `serde_json::Value` (which implements
# `Deserialize`) so YAML and JSON documents share one in-memory representation.
serde_yaml_ng = "0.10"

# Temporary directories for tests that need real files on disk
tempfile = "3"
